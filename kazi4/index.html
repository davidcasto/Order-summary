<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="big_box">
             <div class="small_box">
              <img src="../images/illustration-hero.svg">
             </div>
             <div class="details">
                   <div class="heading">
                       <h1>Order Summary</h1>
                   </div>
                   <div class="paragraph">
                    <p class="deta">Your can now listen to millions of songs,
                      audobooks and podcasts on any device
                      anywhere you like!
                    </p>
                   </div>
                   <div class="box_icon">
                    <div class="icon">
                      <img src="../images/icon-music.svg" style="width: 35px; height: 35px; border-radius: 20px; margin-left: 15px;margin-top: 25px;">
                       <div class="annaul">
                        <h2>Annual Plan</h2>
                        <h3>$59 99/year</h3>
                       </div>
                       <div class="change">
                        <a href="#">Change</a>
                       </div>
                   </div>
                </div>
                   <div class="betton">
                       <button style="padding-top: 4px;">Proceed to Payment</button>
                   </div>
                   <div class="para">
                      <p class="top">Cancel Order</p>
                   </div>
             </div>
        </div>
    </div>
</body>
</html>
